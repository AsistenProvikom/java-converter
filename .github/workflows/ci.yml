name: CI

on:
  push:
    branches: ["main", "milestone-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned project-2024 fixture source. Never execute fixture code.
  FIXTURE_REPOSITORY: AsistenProvikom/project-2024
  FIXTURE_REF: cf35f7def1333bf05b3de22206e803567bc7de3b

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }} tests, security, artifacts, and HTTP Range
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - name: Checkout converter
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout pinned game fixtures
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FIXTURE_REPOSITORY }}
          ref: ${{ env.FIXTURE_REF }}
          path: project-2024
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Archive security regression tests
        env:
          PROVIKOM_GAMES_DIR: ${{ github.workspace }}/project-2024/games
          PROVIKOM_REQUIRE_FIXTURES: "1"
        run: python -m unittest tests.test_build_safety -v

      - name: Artifact generation and Range Request tests
        env:
          PROVIKOM_GAMES_DIR: ${{ github.workspace }}/project-2024/games
          PROVIKOM_REQUIRE_FIXTURES: "1"
        run: >
          python -m unittest
          tests.test_build
          tests.test_browser_smoke.TestArtifactHTTP
          tests.test_browser_smoke.TestBuildCLI
          -v

      - name: Full Python suite without browser execution
        env:
          PROVIKOM_GAMES_DIR: ${{ github.workspace }}/project-2024/games
          PROVIKOM_REQUIRE_FIXTURES: "1"
          PROVIKOM_SKIP_BROWSER: "1"
        run: python -m unittest discover -s tests -v

  browser-smoke:
    name: Playwright Chromium smoke verification
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout converter
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout pinned game fixtures
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FIXTURE_REPOSITORY }}
          ref: ${{ env.FIXTURE_REF }}
          path: project-2024
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with browser test dependencies
        run: python -m pip install -e ".[browser]"

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Verify pinned fixtures exist
        run: |
          test -f "$PROVIKOM_GAMES_DIR/PongGame.jar"
          test -f "$PROVIKOM_GAMES_DIR/CarTraffic.jar"
          test -f "$PROVIKOM_GAMES_DIR/flappy.jar"
          test -f "$PROVIKOM_GAMES_DIR/PaddleGame.jar"
          test -f "$PROVIKOM_GAMES_DIR/lib/AbsoluteLayout.jar"
        env:
          PROVIKOM_GAMES_DIR: ${{ github.workspace }}/project-2024/games

      - name: Run browser verification
        env:
          PROVIKOM_GAMES_DIR: ${{ github.workspace }}/project-2024/games
          PROVIKOM_REQUIRE_FIXTURES: "1"
          PROVIKOM_REQUIRE_BROWSER: "1"
        run: python -m unittest tests.test_browser_smoke -v

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification-evidence
          path: |
            docs/screenshots
            docs/verification
            build/verification
          if-no-files-found: warn
          retention-days: 14
