name: SwingJS Feasibility

on:
  push:
    branches: ["main", "milestone-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swingjs-feasibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce-transpile-and-verify:
    name: Reproduce pinned Java2Script transpilation and browser verification
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout converter
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python browser dependencies
        run: python -m pip install -e ".[browser]"

      - name: Install Chromium and display dependencies
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install --yes xvfb libgtk-3-0

      - name: Download pinned toolchain and verify checksums
        run: python3 tools/swingjs/setup_toolchain.py

      - name: Show pinned toolchain record
        run: |
          test -f build/swingjs-toolchain/toolchain.json
          python3 -m json.tool build/swingjs-toolchain/toolchain.json

      - name: Transpile the original POC with headless Eclipse Java2Script
        run: >
          xvfb-run -a --server-args="-screen 0 1280x900x24"
          python3 tools/swingjs/build_swingjs_poc.py --require-desktop

      - name: Prove the application JavaScript was generated
        run: |
          test -s build/swingjs-poc/site/poc_SwingPoc.html
          test -s build/swingjs-poc/site/swingjs/j2s/poc/SwingPoc.js
          grep -q 'Clazz.newClass' build/swingjs-poc/site/swingjs/j2s/poc/SwingPoc.js
          grep -q 'STATE x=' build/swingjs-poc/site/swingjs/j2s/poc/SwingPoc.js
          grep -q 'J2S SwingJS plugin processed' build/swingjs-poc/eclipse.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          record = json.loads(Path("build/swingjs-poc/toolchain.json").read_text())
          assert record["generated_js_contains_poc_class"] is True, record
          assert record["generated_js_contains_state_output"] is True, record
          assert record["java2script_commit"] == "4091b289014b99099481c37f7c151aeb24c713cd", record
          print("Generated JavaScript size:", record["generated_js_size_bytes"])
          print("Generated JavaScript SHA-256:", record["generated_js_sha256"])
          PY

      - name: Verify animation and keyboard interaction in Chromium
        run: >
          python3 tools/swingjs/verify_swingjs_poc.py
          --artifact-dir build/swingjs-poc
          --evidence build/swingjs-poc/verification.json
          --screenshot build/swingjs-poc/verification.png

      - name: Assert machine-readable runtime evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          evidence = json.loads(Path("build/swingjs-poc/verification.json").read_text())
          assert evidence["state"] == "runtime_verified", evidence["state"]
          checks = {check["name"]: check["passed"] for check in evidence["checks"]}
          required = {
              "canvas_mounted",
              "swing_timer_animates",
              "graphics2d_rendered",
              "keyboard_horizontal",
              "keyboard_vertical",
              "keyboard_pause",
              "keyboard_reset",
          }
          missing = sorted(required - set(checks))
          assert not missing, "Missing checks: {}".format(missing)
          failed = sorted(name for name, passed in checks.items() if not passed)
          assert not failed, "Failed checks: {}".format(failed)
          print("Runtime evidence state:", evidence["state"])
          print("Startup ms:", evidence["metrics"]["startup_ms"])
          print("Network bytes:", evidence["metrics"]["network_bytes"])
          PY

      - name: Build the POC through the production source adapter
        run: >
          xvfb-run -a --server-args="-screen 0 1280x900x24"
          python3 -m provikom_converter build-project examples/swing-poc
          --backend swingjs
          --output build/swingjs-adapter-poc
          --title "SwingJS Adapter POC"
          --toolchain-dir build/swingjs-toolchain
          --force

      - name: Verify the production adapter artifact in Chromium
        run: >
          python3 -m provikom_converter verify-swingjs
          build/swingjs-adapter-poc
          --evidence build/swingjs-adapter-poc/verification.json
          --screenshot build/swingjs-adapter-poc/verification.png

      - name: Assert source adapter manifest and ownership
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from provikom_converter.build_safety import _is_provikom_artifact
          artifact = Path("build/swingjs-adapter-poc")
          manifest = json.loads((artifact / "manifest.json").read_text())
          assert manifest["backend"] == "swingjs", manifest["backend"]
          assert manifest["source_project"]["main_class"] == "poc.SwingPoc"
          assert manifest["source_project"]["source_file_count"] == 1
          assert manifest["lifecycle"]["state"] == "runtime_verified", manifest["lifecycle"]
          assert _is_provikom_artifact(artifact), "ownership marker validation failed"
          evidence = json.loads((artifact / "verification.json").read_text())
          checks = {check["name"]: check["passed"] for check in evidence["checks"]}
          required = {
              "canvas_mounted",
              "graphics_rendered",
              "generated_javascript_loaded",
              "swing_timer_animates",
              "keyboard_horizontal",
              "keyboard_vertical",
              "keyboard_pause",
              "keyboard_reset",
          }
          missing = sorted(required - set(checks))
          assert not missing, "Missing checks: {}".format(missing)
          failed = sorted(name for name, passed in checks.items() if not passed)
          assert not failed, "Failed checks: {}".format(failed)
          print("Source adapter state:", manifest["lifecycle"]["state"])
          print("Generated JS:", manifest["source_project"]["generated_js"])
          PY

      - name: Build and verify the second source fixture
        run: |
          xvfb-run -a --server-args="-screen 0 1280x900x24" python3 -m provikom_converter build-project examples/swing-widgets --backend swingjs --output build/swingjs-widgets --title "SwingJS Widgets" --toolchain-dir build/swingjs-toolchain --force
          python3 -m provikom_converter verify-swingjs build/swingjs-widgets --evidence build/swingjs-widgets/verification.json --screenshot build/swingjs-widgets/verification.png
          python3 - <<'PY'
          import json
          from pathlib import Path
          from provikom_converter.build_safety import _is_provikom_artifact
          artifact = Path("build/swingjs-widgets")
          manifest = json.loads((artifact / "manifest.json").read_text())
          assert manifest["backend"] == "swingjs"
          assert manifest["source_project"]["main_class"] == "compat.WidgetDemo"
          assert manifest["lifecycle"]["state"] == "runtime_verified"
          assert _is_provikom_artifact(artifact)
          evidence = json.loads((artifact / "verification.json").read_text())
          checks = {check["name"]: check["passed"] for check in evidence["checks"]}
          for name in ("canvas_mounted", "graphics_rendered", "generated_javascript_loaded",
                       "swing_timer_animates", "mouse_click_responds"):
              assert checks.get(name), name
          print("Second fixture state:", manifest["lifecycle"]["state"])
          PY

      - name: Upload SwingJS diagnostics and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swingjs-feasibility-evidence
          # Only source-derived POC output, logs, hashes, and verification
          # evidence are uploaded. The SwingJS runtime/site is not redistributed.
          path: |
            build/swingjs-toolchain/toolchain.json
            build/swingjs-poc/toolchain.json
            build/swingjs-poc/*.log
            build/swingjs-poc/desktop-poc.png
            build/swingjs-poc/verification.json
            build/swingjs-poc/verification.png
            build/swingjs-poc/site/poc_SwingPoc.html
            build/swingjs-poc/site/swingjs/j2s/poc/SwingPoc.js
            build/swingjs-adapter-poc/manifest.json
            build/swingjs-adapter-poc/index.html
            build/swingjs-adapter-poc/evidence/build.json
            build/swingjs-adapter-poc/evidence/*.log
            build/swingjs-adapter-poc/verification.json
            build/swingjs-adapter-poc/verification.png
            build/swingjs-adapter-poc/swingjs/j2s/poc/SwingPoc.js
            build/swingjs-widgets/manifest.json
            build/swingjs-widgets/index.html
            build/swingjs-widgets/evidence/build.json
            build/swingjs-widgets/evidence/*.log
            build/swingjs-widgets/verification.json
            build/swingjs-widgets/verification.png
            build/swingjs-widgets/swingjs/j2s/compat/WidgetDemo.js
          if-no-files-found: warn
          retention-days: 14
